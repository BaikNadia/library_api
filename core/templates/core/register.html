{% extends 'core/base.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="page-container">
    <div class="decorative-bg">
        <span class="deco-emoji top-right">🕯️</span>
        <span class="deco-emoji bottom-left">📜</span>
    </div>

    <div class="card-paper auth-card">
        <div class="card-header">
            <div class="header-emoji">📖</div>
            <h2>Читательский билет</h2>
            <div class="divider"></div>
            <p class="subtitle">Присоединяйтесь к хранилищу знаний</p>
        </div>

        <div id="register-error" class="alert alert-error hidden"></div>

        <form id="register-form" class="form">
            <div class="form-row">
                <div class="form-group">
                    <label>ЛОГИН *</label>
                    <input type="text" name="username" required
                           placeholder="librarian_ivan" class="input-field">
                    <span class="field-error" data-field="username"></span>
                </div>
                <div class="form-group">
                    <label>EMAIL *</label>
                    <input type="email" name="email" required
                           placeholder="ivan@example.com" class="input-field">
                    <span class="field-error" data-field="email"></span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>ИМЯ *</label>
                    <input type="text" name="first_name" required
                           placeholder="Иван" class="input-field">
                    <span class="field-error" data-field="first_name"></span>
                </div>
                <div class="form-group">
                    <label>ФАМИЛИЯ *</label>
                    <input type="text" name="last_name" required
                           placeholder="Петров" class="input-field">
                    <span class="field-error" data-field="last_name"></span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>ПАРОЛЬ *</label>
                    <input type="password" name="password" required
                           placeholder="Минимум 8 символов" class="input-field">
                    <span class="field-error" data-field="password"></span>
                </div>
                <div class="form-group">
                    <label>ПОВТОР ПАРОЛЯ *</label>
                    <input type="password" name="password2" required
                           placeholder="Ещё раз" class="input-field">
                    <span class="field-error" data-field="password2"></span>
                </div>
            </div>

            <div class="form-group">
                <label>РОЛЬ В БИБЛИОТЕКЕ</label>
                <div class="role-grid">
                    <label class="role-card selected" data-value="reader">
                        <input type="radio" name="user_type" value="reader" checked>
                        <div class="role-emoji">📖</div>
                        <div class="role-title">Читатель</div>
                        <div class="role-desc">Просмотр и займы книг</div>
                    </label>
                    <label class="role-card" data-value="librarian">
                        <input type="radio" name="user_type" value="librarian">
                        <div class="role-emoji">🎓</div>
                        <div class="role-title">Библиотекарь</div>
                        <div class="role-desc">Управление каталогом</div>
                    </label>
                </div>
            </div>

            <button type="submit" class="btn-primary btn-full" id="submit-btn">
                ПОЛУЧИТЬ БИЛЕТ
            </button>
        </form>

        <div class="card-footer">
            <p>Уже есть билет?</p>
            <a href="{% url 'login' %}" class="link-arrow">ВОЙТИ →</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    initRegisterPage();
</script>
{% endblock %}
