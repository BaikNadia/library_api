{% extends 'core/base.html' %}

{% block title %}Каталог книг{% endblock %}

{% block content %}
<div class="page-content">
    <div class="page-title-block">
        <h1>Каталог книг</h1>
        <div class="ornament-line">
            <span class="line"></span>
            <span class="symbol">❦</span>
            <span class="line"></span>
        </div>
        <p class="subtitle" id="books-count">Загрузка...</p>
    </div>

    <!-- Панель фильтров -->
    <div class="card-paper filter-panel">
        <div class="filter-grid">
            <input type="text" id="search-input"
                   placeholder="🔍 Поиск по названию, автору или ISBN..."
                   class="input-field">

            <select id="genre-select" class="input-field">
                <option value="">Все жанры</option>
                <option value="fiction">Художественная</option>
                <option value="non-fiction">Нон-фикшн</option>
                <option value="science">Наука</option>
                <option value="technology">Технологии</option>
                <option value="history">История</option>
                <option value="biography">Биография</option>
                <option value="fantasy">Фэнтези</option>
                <option value="mystery">Детектив</option>
                <option value="romance">Роман</option>
                <option value="other">Другое</option>
            </select>

            <button id="reset-btn" class="btn-secondary">СБРОСИТЬ</button>
        </div>
    </div>

    <!-- Список книг -->
    <div id="books-container">
        <div class="loading-state">
            <div class="loading-emoji">📚</div>
            <p>Открываем каталог...</p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    initCatalogPage();
</script>
{% endblock %}
