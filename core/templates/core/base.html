{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Библиотека{% endblock %}</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Наш CSS -->
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">

    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- ============ НАВИГАЦИЯ ============ -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="{% url 'catalog' %}" class="navbar-logo">
                <span class="logo-emoji">📚</span>
                <div>
                    <h1>БИБЛИОТЕКА</h1>
                    <p>ХРАНИЛИЩЕ ЗНАНИЙ</p>
                </div>
            </a>

            <div class="navbar-menu">
                <a href="{% url 'catalog' %}" class="nav-link">КАТАЛОГ</a>
                <a href="{% url 'blog' %}" class="nav-link">БЛОГ</a>

                <div id="auth-nav">
                    <!-- Заполняется через JavaScript -->
                </div>
            </div>
        </div>
        <div class="navbar-line"></div>
    </nav>

    <!-- ============ КОНТЕНТ СТРАНИЦЫ ============ -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- ============ ФУТЕР ============ -->
    <footer class="footer">
        <p>© 2024 Библиотека. Хранилище знаний.</p>
        <p class="footer-ornament">❦ ❦ ❦</p>
    </footer>

    <!-- ============ JAVASCRIPT ============ -->
    <script src="{% static 'core/js/app.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
